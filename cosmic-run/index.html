<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosmic Run — 3D Parkour</title>
  <meta name="description" content="A premium 3D cosmic parkour game. Run, jump, slide and wall-jump through futuristic space stations.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e27;
      -webkit-tap-highlight-color: transparent;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0e27;
      color: #00e5ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      z-index: 999;
      transition: opacity 0.5s;
    }
    #loading h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #game-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>COSMIC RUN</h1>
    <div class="spinner"></div>
    <p style="margin-top:1rem;color:#a0a8c0;font-size:0.9rem;">Loading cosmic engines...</p>
  </div>
  <div id="game-container"></div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="cosmic-run.js"></script>
  <script>
    // Initialize game when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('game-container');

      // Wait for Three.js to load
      const checkThree = setInterval(() => {
        if (typeof THREE !== 'undefined') {
          clearInterval(checkThree);

          // Small delay to ensure script parsing
          setTimeout(() => {
            try {
              window.game = startGame(container);

              // Hide loading screen
              const loading = document.getElementById('loading');
              loading.style.opacity = '0';
              setTimeout(() => loading.remove(), 500);
            } catch (err) {
              console.error('Failed to start game:', err);
              document.getElementById('loading').innerHTML = '<p style="color:#ff5252">Failed to load game. Please refresh.</p>';
            }
          }, 100);
        }
      }, 50);

      // Timeout fallback
      setTimeout(() => {
        if (typeof THREE === 'undefined') {
          document.getElementById('loading').innerHTML = '<p style="color:#ff5252">Failed to load 3D engine. Check your connection.</p>';
        }
      }, 10000);
    });
  </script>
</body>
</html>
