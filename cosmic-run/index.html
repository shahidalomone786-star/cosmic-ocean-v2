<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosmic Run — 3D Parkour</title>
  <meta name="description" content="A premium 3D cosmic parkour game. Run, jump, slide and wall-jump through futuristic space stations.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e27;
      -webkit-tap-highlight-color: transparent;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0e27;
      color: #00e5ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      z-index: 999;
      transition: opacity 0.5s;
    }
    #loading h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #game-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>COSMIC RUN</h1>
    <div class="spinner"></div>
    <p style="margin-top:1rem;color:#a0a8c0;font-size:0.9rem;">Loading cosmic engines...</p>
  </div>
  <div id="game-container"></div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="cosmic-run.js"></script>
  <script>
    // Initialize game when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('game-container');
      const loading = document.getElementById('loading');

      const showRuntimeError = (error) => {
        const details = error instanceof Error
          ? (error.stack || `${error.name}: ${error.message}`)
          : String(error);
        loading.style.opacity = '1';
        loading.innerHTML = '';

        const heading = document.createElement('p');
        heading.textContent = 'Cosmic Run could not start';
        heading.style.cssText = 'margin:0;color:#ff5252;font-size:1rem;font-weight:600;';

        const message = document.createElement('p');
        message.textContent = 'The exact runtime error is shown below.';
        message.style.cssText = 'margin:0.75rem 0 0;color:#a0a8c0;font-size:0.85rem;';

        const stack = document.createElement('pre');
        stack.textContent = details;
        stack.style.cssText = 'width:min(90vw,900px);max-height:45vh;overflow:auto;margin:1rem 0 0;padding:1rem;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(0,0,0,0.35);border:1px solid rgba(255,82,82,0.35);border-radius:8px;color:#ffb3b3;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;';
        loading.append(heading, message, stack);
      };

      // Wait for Three.js to load
      const checkThree = setInterval(() => {
        if (typeof THREE !== 'undefined') {
          clearInterval(checkThree);

          // Small delay to ensure script parsing
          setTimeout(() => {
            try {
              window.game = startGame(container);

              // Hide loading screen
              loading.style.opacity = '0';
              setTimeout(() => loading.remove(), 500);
            } catch (err) {
              console.error('Failed to start game:', err);
              showRuntimeError(err);
            }
          }, 100);
        }
      }, 50);

      // Timeout fallback
      setTimeout(() => {
        if (typeof THREE === 'undefined') {
          showRuntimeError(new Error('Three.js did not become available before the 10 second loading timeout'));
        }
      }, 10000);
    });
  </script>
</body>
</html>
