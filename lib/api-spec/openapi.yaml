openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: biology
    description: Biology Hub discovery operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /biology/search:
    get:
      operationId: biologySearch
      tags: [biology]
      summary: Search official biology sources
      description: Searches official biology and biomedical source APIs without fabricated fallback content.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Biology search results
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/BiologySearchPayload"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    BiologySearchItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        url:
          type: string
        imageUrl:
          type: ["string", "null"]
          description: Official image URL when the provider supplies one.
        source:
          type: string
          enum: [wikipedia, nih, ncbi, pubmed, medlineplus, openalex, semanticscholar]
        kind:
          type: string
          enum: [article, research]
        date:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        citationCount:
          type: ["integer", "null"]
        openAccess:
          type: ["boolean", "null"]
      required: [id, title, description, url, imageUrl, source, kind, date, authors, citationCount, openAccess]
    BiologySourceStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ready, unavailable]
        message:
          type: ["string", "null"]
      required: [source, status, message]
    BiologySearchPayload:
      type: object
      properties:
        query:
          type: string
        page:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BiologySearchItem"
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/BiologySourceStatus"
        hasMore:
          type: boolean
      required: [query, page, items, sourceStatus, hasMore]

