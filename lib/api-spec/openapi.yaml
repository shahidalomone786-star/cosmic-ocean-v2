openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: biology
    description: Biology Hub discovery operations
  - name: astronomy
    description: Cosmic Atlas astronomical object discovery operations
  - name: gallery
    description: Universal Gallery provider-backed image discovery operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /biology/search:
    get:
      operationId: biologySearch
      tags: [biology]
      summary: Search official biology sources
      description: Searches official biology and biomedical source APIs without fabricated fallback content.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: author
          in: query
          required: false
          schema:
            type: string
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [article, paper, research]
        - name: openAccess
          in: query
          required: false
          schema:
            type: boolean
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, date, cited]
      responses:
        "200":
          description: Biology search results
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/BiologySearchPayload"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /astronomy/search:
    get:
      operationId: astronomySearch
      tags: [astronomy]
      summary: Search authoritative astronomical object archives
      description: Searches server-side adapters for SIMBAD, the NASA Exoplanet Archive, and NASA's official Image and Video Library. Results are normalized without fabricated scientific values.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AstronomyCategoryId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 6
            maximum: 24
            default: 12
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AstronomySourceId"
        - name: objectType
          in: query
          required: false
          schema:
            type: string
        - name: minDistance
          in: query
          required: false
          schema:
            type: number
        - name: maxDistance
          in: query
          required: false
          schema:
            type: number
        - name: discoveryYear
          in: query
          required: false
          schema:
            type: integer
        - name: observationSource
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Normalized astronomical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstronomySearchPayload"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /astronomy/map:
    get:
      operationId: astronomyMap
      tags: [astronomy]
      summary: Retrieve real astronomical objects for a sky viewport
      description: Queries authoritative coordinate-bearing Atlas providers for only the requested right ascension and declination window. Results are normalized without fabricated scientific values.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AstronomyCategoryId"
        - name: raMin
          in: query
          required: true
          schema:
            type: number
            minimum: 0
            maximum: 360
        - name: raMax
          in: query
          required: true
          schema:
            type: number
            minimum: 0
            maximum: 360
        - name: decMin
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: decMax
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: zoom
          in: query
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 24
            maximum: 180
            default: 96
      responses:
        "200":
          description: Real normalized astronomical objects in the requested viewport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstronomyMapPayload"
        "400":
          description: Invalid viewport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /astronomy/objects/{id}:
    get:
      operationId: astronomyObject
      tags: [astronomy]
      summary: Retrieve one normalized astronomical object
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalized astronomical object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstronomyObjectPayload"
        "404":
          description: Astronomical object not found in its source archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /astronomy/suggestions:
    get:
      operationId: astronomySuggestions
      tags: [astronomy]
      summary: Suggest real astronomical records from provider archives
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AstronomyCategoryId"
      responses:
        "200":
          description: Provider-backed suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstronomySuggestionsPayload"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gallery/search:
    get:
      operationId: gallerySearch
      tags: [gallery]
      summary: Search licensed image collections through isolated provider adapters
      description: Searches only semantically relevant registered Universal Gallery connectors in parallel, preserves provider rights metadata, and classifies each result without inventing unavailable license information. Individual provider failures never fail the aggregate response.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 6
            maximum: 60
            default: 30
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [all, space, nature, ocean, animals, plants, earth, science, medical, history, art, architecture, maps, culture]
        - name: media
          in: query
          required: false
          schema:
            type: string
            enum: [all, photos, illustrations, artwork, scientific-imagery, maps, 3d-molecular]
        - name: license
          in: query
          required: false
          schema:
            type: string
            enum: [all, public-domain, cc0, commercial, attribution, open-license]
        - name: quality
          in: query
          required: false
          schema:
            type: string
            enum: [any, hd, 2k, 4k]
        - name: orientation
          in: query
          required: false
          schema:
            type: string
            enum: [all, landscape, portrait, square]
        - name: providers
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated provider ids. Omit to query all Phase A providers.
      responses:
        "200":
          description: Normalized licensed gallery results and non-blocking provider statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GallerySearchPayload"
        "400":
          description: Invalid gallery query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    BiologySearchItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        url:
          type: string
        imageUrl:
          type: ["string", "null"]
          description: Official image URL when the provider supplies one.
        source:
          type: string
          enum: [wikipedia, wikidata, pubmed, europepmc, openalex]
        kind:
          type: string
          enum: [article, research]
        date:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        citationCount:
          type: ["integer", "null"]
        openAccess:
          type: ["boolean", "null"]
        language:
          type: ["string", "null"]
      required: [id, title, description, url, imageUrl, source, kind, date, authors, citationCount, openAccess, language]
    BiologySourceStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ready, unavailable]
        message:
          type: ["string", "null"]
      required: [source, status, message]
    BiologySearchPayload:
      type: object
      properties:
        query:
          type: string
        page:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BiologySearchItem"
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/BiologySourceStatus"
        hasMore:
          type: boolean
      required: [query, page, items, sourceStatus, hasMore]
    AstronomyCategoryId:
      type: string
      enum: [universe, galaxies, stars, exoplanets, solar-system, moons, nebulae, black-holes, star-clusters, deep-sky-objects, missions, spacecraft, supernovae, nearby-objects]
    AstronomySourceId:
      type: string
      enum: [nasa, nasa-exoplanet-archive, esa, gaia, mast, simbad, sdss, other]
    AstronomyCoordinates:
      type: object
      properties:
        rightAscension:
          type: ["number", "null"]
        declination:
          type: ["number", "null"]
        coordinateSystem:
          type: ["string", "null"]
        epoch:
          type: ["string", "null"]
      required: [rightAscension, declination, coordinateSystem, epoch]
    AstronomyDistance:
      type: object
      properties:
        value:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        uncertainty:
          type: ["number", "null"]
      required: [value, unit, uncertainty]
    AstronomyObject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        category:
          $ref: "#/components/schemas/AstronomyCategoryId"
        aliases:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        coordinates:
          anyOf:
            - $ref: "#/components/schemas/AstronomyCoordinates"
            - type: "null"
        distance:
          anyOf:
            - $ref: "#/components/schemas/AstronomyDistance"
            - type: "null"
        source:
          $ref: "#/components/schemas/AstronomySourceId"
        sourceId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        imageReferences:
          type: array
          items:
            type: string
        observationReferences:
          type: array
          items:
            type: string
        relatedObjects:
          type: array
          items:
            $ref: "#/components/schemas/AstronomyObject"
      required: [id, name, type, category, aliases, description, coordinates, distance, source, sourceId, metadata, imageReferences, observationReferences, relatedObjects]
    AstronomySourceStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ready, unavailable]
        message:
          type: ["string", "null"]
      required: [source, status, message]
    AstronomySearchPayload:
      type: object
      properties:
        query:
          type: string
        category:
          $ref: "#/components/schemas/AstronomyCategoryId"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AstronomyObject"
        nextCursor:
          type: ["string", "null"]
        hasMore:
          type: boolean
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/AstronomySourceStatus"
      required: [query, category, items, nextCursor, hasMore, sourceStatus]
    AstronomyMapViewport:
      type: object
      properties:
        raMin:
          type: number
        raMax:
          type: number
        decMin:
          type: number
        decMax:
          type: number
        zoom:
          type: number
      required: [raMin, raMax, decMin, decMax, zoom]
    AstronomyMapPayload:
      type: object
      properties:
        viewport:
          $ref: "#/components/schemas/AstronomyMapViewport"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AstronomyObject"
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/AstronomySourceStatus"
        truncated:
          type: boolean
      required: [viewport, items, sourceStatus, truncated]
    AstronomySuggestion:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [object, alias, catalog, type]
        source:
          $ref: "#/components/schemas/AstronomySourceId"
        objectId:
          type: string
      required: [value, label, kind, source, objectId]
    AstronomySuggestionsPayload:
      type: object
      properties:
        query:
          type: string
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AstronomySuggestion"
      required: [query, suggestions]
    AstronomyObjectPayload:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/AstronomyObject"
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/AstronomySourceStatus"
      required: [item, sourceStatus]
    GalleryItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: string
        thumbnailUrl:
          type: string
        source:
          type: string
        sourceUrl:
          type: string
        creator:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        license:
          type: string
        licenseUrl:
          type: ["string", "null"]
        attribution:
          type: ["string", "null"]
        licenseClass:
          type: string
          enum: [PUBLIC_DOMAIN, CC0, COMMERCIAL_USE, ATTRIBUTION_REQUIRED, OPEN_LICENSE, UNKNOWN]
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
      required: [id, title, description, imageUrl, thumbnailUrl, source, sourceUrl, creator, date, category, tags, license, licenseUrl, licenseClass, attribution, width, height]
    GalleryProviderStatus:
      type: object
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE, NOT_CONFIGURED, ERROR, NO_RESULTS]
        count:
          type: integer
        message:
          type: ["string", "null"]
      required: [provider, status, count, message]
    GallerySearchPayload:
      type: object
      properties:
        query:
          type: string
        page:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/GalleryItem"
        providerStatus:
          type: array
          items:
            $ref: "#/components/schemas/GalleryProviderStatus"
        hasMore:
          type: boolean
      required: [query, page, items, providerStatus, hasMore]

