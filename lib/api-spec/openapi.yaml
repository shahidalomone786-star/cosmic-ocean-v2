openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: biology
    description: Biology Hub discovery operations
  - name: astronomy
    description: Cosmic Atlas astronomical object discovery operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /biology/search:
    get:
      operationId: biologySearch
      tags: [biology]
      summary: Search official biology sources
      description: Searches official biology and biomedical source APIs without fabricated fallback content.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: author
          in: query
          required: false
          schema:
            type: string
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [article, paper, research]
        - name: openAccess
          in: query
          required: false
          schema:
            type: boolean
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, date, cited]
      responses:
        "200":
          description: Biology search results
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/BiologySearchPayload"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /astronomy/search:
    get:
      operationId: astronomySearch
      tags: [astronomy]
      summary: Search authoritative astronomical object archives
      description: Searches server-side adapters for SIMBAD, the NASA Exoplanet Archive, and NASA's official Image and Video Library. Results are normalized without fabricated scientific values.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AstronomyCategoryId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 6
            maximum: 24
            default: 12
      responses:
        "200":
          description: Normalized astronomical search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstronomySearchPayload"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /astronomy/objects/{id}:
    get:
      operationId: astronomyObject
      tags: [astronomy]
      summary: Retrieve one normalized astronomical object
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Normalized astronomical object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AstronomyObjectPayload"
        "404":
          description: Astronomical object not found in its source archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    BiologySearchItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        url:
          type: string
        imageUrl:
          type: ["string", "null"]
          description: Official image URL when the provider supplies one.
        source:
          type: string
          enum: [wikipedia, wikidata, pubmed, europepmc, openalex]
        kind:
          type: string
          enum: [article, research]
        date:
          type: ["string", "null"]
        authors:
          type: array
          items:
            type: string
        citationCount:
          type: ["integer", "null"]
        openAccess:
          type: ["boolean", "null"]
        language:
          type: ["string", "null"]
      required: [id, title, description, url, imageUrl, source, kind, date, authors, citationCount, openAccess, language]
    BiologySourceStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ready, unavailable]
        message:
          type: ["string", "null"]
      required: [source, status, message]
    BiologySearchPayload:
      type: object
      properties:
        query:
          type: string
        page:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BiologySearchItem"
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/BiologySourceStatus"
        hasMore:
          type: boolean
      required: [query, page, items, sourceStatus, hasMore]
    AstronomyCategoryId:
      type: string
      enum: [universe, galaxies, stars, exoplanets, solar-system, moons, nebulae, black-holes, star-clusters, deep-sky-objects, missions, spacecraft, supernovae, nearby-objects]
    AstronomySourceId:
      type: string
      enum: [nasa, nasa-exoplanet-archive, esa, gaia, mast, simbad, sdss, other]
    AstronomyCoordinates:
      type: object
      properties:
        rightAscension:
          type: ["number", "null"]
        declination:
          type: ["number", "null"]
        coordinateSystem:
          type: ["string", "null"]
        epoch:
          type: ["string", "null"]
      required: [rightAscension, declination, coordinateSystem, epoch]
    AstronomyDistance:
      type: object
      properties:
        value:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        uncertainty:
          type: ["number", "null"]
      required: [value, unit, uncertainty]
    AstronomyObject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        category:
          $ref: "#/components/schemas/AstronomyCategoryId"
        aliases:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        coordinates:
          anyOf:
            - $ref: "#/components/schemas/AstronomyCoordinates"
            - type: "null"
        distance:
          anyOf:
            - $ref: "#/components/schemas/AstronomyDistance"
            - type: "null"
        source:
          $ref: "#/components/schemas/AstronomySourceId"
        sourceId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        imageReferences:
          type: array
          items:
            type: string
        observationReferences:
          type: array
          items:
            type: string
      required: [id, name, type, category, aliases, description, coordinates, distance, source, sourceId, metadata, imageReferences, observationReferences]
    AstronomySourceStatus:
      type: object
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ready, unavailable]
        message:
          type: ["string", "null"]
      required: [source, status, message]
    AstronomySearchPayload:
      type: object
      properties:
        query:
          type: string
        category:
          $ref: "#/components/schemas/AstronomyCategoryId"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AstronomyObject"
        nextCursor:
          type: ["string", "null"]
        hasMore:
          type: boolean
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/AstronomySourceStatus"
      required: [query, category, items, nextCursor, hasMore, sourceStatus]
    AstronomyObjectPayload:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/AstronomyObject"
        sourceStatus:
          type: array
          items:
            $ref: "#/components/schemas/AstronomySourceStatus"
      required: [item, sourceStatus]

