kind = "web"
previewPath = "/"
title = "Cosmos"
version = "1.0.0"
id = "artifacts/cosmos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "VITE_SUPABASE_URL=\"$VITE_SUPABASE_URL\" VITE_SUPABASE_ANON_KEY=\"$VITE_SUPABASE_ANON_KEY\" pnpm --filter @workspace/cosmos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cosmos", "run", "build" ]
serve = "static"
publicDir = "artifacts/cosmos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
